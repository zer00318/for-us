<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>For us</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Commissioner:wght@400;600;700&family=Caveat:wght@700&display=swap">
<style>
:root{--paper:#F4F6F8;--surface:#fff;--ink:#1D2230;--muted:#5C6474;--line:#DCE1E8;--home:#D8406E;--bad:#C62E2E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#12151C;--surface:#1A1F29;--ink:#E9ECF2;--muted:#9AA3B2;--line:#2A3140;--home:#FF7AA2;--bad:#FF7373;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:400 17px/1.5 "Commissioner",system-ui,sans-serif;padding:16px}
form{width:100%;max-width:420px}
.hand{font:700 30px/1.1 "Caveat",cursive;color:var(--home);transform:rotate(-2deg);display:inline-block}
h1{font:400 clamp(40px,10vw,64px)/1 "Gloock",Georgia,serif;margin:8px 0 14px}
p{color:var(--muted);margin:0 0 22px}
input[type=password]{width:100%;font:inherit;color:inherit;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
input[type=password]:focus{outline:2px solid var(--ink);outline-offset:2px}
button{margin-top:12px;width:100%;font:700 17px "Commissioner",sans-serif;padding:14px;border-radius:14px;border:0;background:var(--ink);color:var(--paper);cursor:pointer}
label.r{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:15px;color:var(--muted)}
#err{color:var(--bad);min-height:1.5em;margin-top:10px;font-weight:600}
</style></head>
<body><form id="f" autocomplete="off">
<div class="hand">for you, from me</div>
<h1>Us, after my thesis</h1>
<p>Type the word I gave you.</p>
<input type="password" id="pw" aria-label="Passphrase" autofocus>
<label class="r"><input type="checkbox" id="rem" checked> Remember on this device</label>
<button>Open</button>
<div id="err" role="alert"></div>
</form>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
let saved=null;try{saved=localStorage.getItem('us_pw')}catch(e){}
if(saved)open_(saved).catch(()=>{try{localStorage.removeItem('us_pw')}catch(e){}});
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();const pw=document.getElementById('pw').value.trim();const err=document.getElementById('err');
  if(!window.crypto||!crypto.subtle){err.textContent='This browser blocks the lock here. Open the https link instead.';return}
  err.textContent='Opening…';
  try{ if(document.getElementById('rem').checked){try{localStorage.setItem('us_pw',pw)}catch(e){}} await open_(pw); }
  catch(x){try{localStorage.removeItem('us_pw')}catch(e){} err.textContent='That\'s not it. Try again?';}
};
